name: release

# Cut by pushing a tag vX.Y.Z whose version matches the binary and the jq
# script. Produces static binaries, the script, SHA256SUMS and a GitHub
# artifact attestation (build provenance) for every asset.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # create the release
      id-token: write      # sign the attestation
      attestations: write  # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Tag matches the version both forms report
        run: |
          want="${GITHUB_REF_NAME#v}"
          go_version=$(sed -n 's/^var version = "\(.*\)"$/\1/p' main.go)
          jq_version=$(sed -n 's/^def acse_index_version: "\(.*\)";$/\1/p' script/acse-index.jq)
          [ "$go_version" = "$want" ] && [ "$jq_version" = "$want" ] || {
            echo "tag $GITHUB_REF_NAME, binary $go_version, script $jq_version"; exit 1; }
      - run: go vet ./... && go test ./...
      - name: Build
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -buildid=" -o "dist/acse-index-${target%/*}-${target#*/}" .
          done
          CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/acse-index" .
          test/parity.sh "$RUNNER_TEMP/acse-index"
          cp script/acse-index.sh script/acse-index.jq dist/
          cp schema/resource-index-1.0.schema.json dist/
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes dist/*
